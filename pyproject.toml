[project]
name = "drift-triage-copilot"
version = "0.1.0"
description = "Drift Triage Co-Pilot — self-healing ML platform with supervisor agent"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # ML / training — the notebook side, your existing work
    "matplotlib>=3.10",
    "mlflow>=3.0",
    "numpy>=2.0",
    "pandas>=2.3",
    "scikit-learn>=1.7",
    "seaborn>=0.13",
    "joblib>=1.4",         # explicit even though sklearn pulls it; we load .joblib at serve time

    # Web framework + validation — both services use these
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",

    # Database stack — both services have tables; only the URLs differ
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",       # async PostgreSQL driver SQLAlchemy uses
    "alembic>=1.13",

    # Inter-service communication
    "httpx>=0.27",         # platform calls the agent's webhook with this
    "redis>=5.0",          # job queue between API and worker (Rasha's; you'll need it for /v1/actions)

    # Observability
    "structlog>=24.0",

    # TODO (Rasha): add langgraph, langchain, langchain-openai or langchain-anthropic, langsmith
]

[dependency-groups]
dev = [
    "ipykernel>=7.2",
    "jupyter>=1.1",
    "pytest>=8.0",            # Friday's CI test suite needs this
    "pytest-asyncio>=0.24",   # for testing async endpoints
    "respx>=0.21",            # mocks httpx so we can test webhook emission without a live agent
]