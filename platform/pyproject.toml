[project]
name = "drift-triage-copilot-platform"
version = "0.1.0"
description = "Platform service: model serving, drift detection, promotion gate, and the bank-marketing training notebook"
readme = "../README.md"
requires-python = ">=3.12"

dependencies = [
    # ML / training — the notebook in platform/mlops/ uses these, and the
    # serving path loads the trained joblib pipeline at startup.
    "matplotlib>=3.10",
    "mlflow>=3.0",
    "numpy>=2.0",
    "pandas>=2.3",
    "scikit-learn>=1.7",
    "seaborn>=0.13",
    "joblib>=1.4",         # explicit even though sklearn pulls it; we load .joblib at serve time

    # Web framework + validation
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",

    # Database stack
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",       # async PostgreSQL driver SQLAlchemy uses
    "alembic>=1.13",

    # Inter-service communication
    "httpx>=0.27",         # platform calls the agent's webhook with this
    "redis>=5.0",          # job queue between API and worker

    # Observability
    "structlog>=24.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2",
    "jupyter>=1.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",            # mocks httpx so we can test webhook emission without a live agent
]

[tool.pytest.ini_options]
# pytest discovers tests under platform/tests/. The app/ source dir is on
# sys.path because pyproject.toml lives at platform/, so `from app.drift...`
# resolves the same way it does in production.
testpaths = ["tests"]
# Both paths are relative to the rootdir (platform/):
#   "."  — so `from app.queue.client import ...` resolves as a subpackage
#          instead of `app/queue/` shadowing Python's stdlib `queue` module.
#   "../" — so `from contracts.v1.actions import ...` works.
pythonpath = [".", "../"]
asyncio_mode = "auto"          # so async tests don't need explicit decorators later
