name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: ruff format check
        run: uvx ruff format --check backend/app/
      - name: ruff lint
        run: uvx ruff check backend/app/

  test:
    name: E2E Trajectory Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "postgresql+asyncpg://placeholder/placeholder"
      REDIS_URL: "redis://localhost:6379"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev
      - name: Run tests
        run: uv run pytest tests/unit/ tests/e2e/ -v

  platform-tests:
    name: Platform Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Run tests
        run: uv run --group dev pytest tests/ -v
