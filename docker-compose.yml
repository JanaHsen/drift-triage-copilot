services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: project5
      POSTGRES_PASSWORD: app
      POSTGRES_DB: drift_triage_copilot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project5 -d drift_triage_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://project5:app@postgres:5432/drift_triage_copilot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./contracts:/app/contracts

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uv run python app/worker.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://project5:app@postgres:5432/drift_triage_copilot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./contracts:/app/contracts

volumes:
  postgres_data:
  redis_data:
